# Dependabot opens PRs against main; nothing auto-merges. Merging a PR
# deploys it (see workflows/deploy.yml), so review and test before merging.
#
# Security updates ignore the schedule, the cooldown and the PR limit: they
# open as soon as an advisory lands (turn on "Dependabot security updates"
# under Settings > Code security).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    # Let new releases sit a few days before proposing them, so yanked or
    # compromised versions are usually caught first.
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR a week for routine bumps; majors get their own PRs. Note
      # that 0.x crates (rand 0.8, sha2 0.10...) can break on a "minor"
      # bump, so if this PR fails to build, split the culprit out with
      # "@dependabot ignore <crate> minor version" on the PR.
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
