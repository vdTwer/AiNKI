[package]
name = "ainki"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AI-native, web-first, e-ink-friendly spaced repetition flashcards with FSRS"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "form"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
fsrs = "6"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
maud = { version = "0.27", features = ["axum"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
rand = "0.8"
rmcp = { version = "3.6", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
