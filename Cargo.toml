[package]
name = "ainki"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AI-native, web-first, e-ink-friendly spaced repetition flashcards with FSRS"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie", "form"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
fsrs = "6"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
maud = { version = "0.27", features = ["axum"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
rand = "0.10"
rmcp = { version = "3.6", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["trace", "limit", "cors", "compression-br", "compression-gzip"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
# Turned off on purpose, each for a reason:
# - Row structs and helper fns sit next to the query that uses them, which
#   keeps behavior local; clippy would hoist them away from their use.
items_after_statements = "allow"
# - write! into a String returns a Result that can never fail; format! with
#   push_str says the same without a fake error path.
format_push_string = "allow"
# - Nursery lints with known false positives in this code base.
option_if_let_else = "allow"
redundant_pub_crate = "allow"
suspicious_operation_groupings = "allow"
# - Math (edit distance, dithering) keeps the textbook's one-letter names.
many_single_char_names = "allow"
similar_names = "allow"
# Contracts: every public method that can fail says how in `# Errors`.
missing_errors_doc = "warn"
# Functions stay under 60 lines (the threshold is in clippy.toml).
too_many_lines = "warn"
